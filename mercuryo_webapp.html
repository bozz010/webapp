<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercuryo Payment</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Redirecting to Mercuryo...</div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на полный экран

        // Получаем адрес из параметров URL
        const urlParams = new URLSearchParams(window.location.search);
        const address = urlParams.get('address') || '';

        // Перенаправление на Mercuryo с минимальными параметрами
        const mercuryoUrl = `https://exchange.mercuryo.io/?fiat_currency=EUR&address=${encodeURIComponent(address)}`;
        window.location.replace(mercuryoUrl);

        // Таймаут для загрузки страницы и выполнения JavaScript
        setTimeout(() => {
            // Функция для поиска и выбора LTC
            function selectLTC() {
                // Пробуем найти выпадающее меню или поле с криптовалютой
                let cryptoSelect = document.querySelector('select[name="crypto"]') || // Общий случай
                                  document.querySelector('select[id*="crypto"]') || // Поиск по ID
                                  document.querySelector('input[name="to"]'); // Или поле ввода

                if (cryptoSelect) {
                    if (cryptoSelect.tagName === 'SELECT') {
                        // Если это выпадающий список
                        for (let option of cryptoSelect.options) {
                            if (option.value.toUpperCase() === 'LTC' || option.text.toUpperCase().includes('LTC')) {
                                cryptoSelect.value = option.value;
                                cryptoSelect.dispatchEvent(new Event('change')); // Симулируем изменение
                                console.log('Selected LTC');
                                return;
                            }
                        }
                    } else if (cryptoSelect.tagName === 'INPUT') {
                        // Если это поле ввода
                        cryptoSelect.value = 'LTC';
                        cryptoSelect.dispatchEvent(new Event('input')); // Симулируем ввод
                        console.log('Set LTC in input');
                        return;
                    }
                } else {
                    console.error('Crypto selector not found');
                }

                // Если не нашли, пробуем через родительский элемент
                let cryptoContainer = document.querySelector('div[class*="crypto"]') ||
                                     document.querySelector('div[id*="crypto"]');
                if (cryptoContainer) {
                    let inputs = cryptoContainer.getElementsByTagName('input');
                    for (let input of inputs) {
                        if (input.value.toUpperCase().includes('BTC')) {
                            input.value = 'LTC';
                            input.dispatchEvent(new Event('input'));
                            console.log('Replaced BTC with LTC');
                            return;
                        }
                    }
                }

                // Если ничего не сработало, повторяем через 1 секунду
                setTimeout(selectLTC, 1000);
            }

            // Запускаем функцию после загрузки страницы
            selectLTC();

            // Показываем попап, если что-то пошло не так
            tg.showPopup({
                title: "Selection Issue",
                message: "If LTC is not selected, check console for errors or retry.",
                buttons: [{ text: "OK", type: "default" }]
            });
        }, 2000); // Ждём 2 секунды, чтобы страница подгрузилась
    </script>
</body>
</html>
