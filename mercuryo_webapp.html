<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercuryo Payment</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Redirecting to Mercuryo...</div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на полный экран

        // Получаем адрес из параметров URL
        const urlParams = new URLSearchParams(window.location.search);
        const address = urlParams.get('address') || '';

        // Загружаем Mercuryo в iframe
        const iframe = document.createElement('iframe');
        iframe.src = `https://exchange.mercuryo.io/?address=${encodeURIComponent(address)}`;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        document.body.appendChild(iframe);

        // Ждём загрузки iframe
        iframe.onload = () => {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

                function selectCurrency() {
                    // Поиск всех элементов, которые могут быть связаны с выбором валюты
                    let selects = iframeDoc.querySelectorAll('select');
                    let inputs = iframeDoc.querySelectorAll('input');
                    let fiatSelect = null;
                    let cryptoSelect = null;

                    // Ищем элемент для фиатной валюты (EUR)
                    selects.forEach(select => {
                        if (select.innerHTML.includes('EUR') || select.id.includes('fiat') || select.name.includes('fiat')) {
                            fiatSelect = select;
                            for (let option of select.options) {
                                if (option.value === 'EUR' || option.text.includes('EUR')) {
                                    select.value = option.value;
                                    select.dispatchEvent(new Event('change'));
                                    console.log('Selected EUR in select:', select.id || select.name);
                                    return;
                                }
                            }
                        }
                    });

                    // Ищем элемент для криптовалюты (LTC)
                    selects.forEach(select => {
                        if (select.innerHTML.includes('LTC') || select.id.includes('crypto') || select.name.includes('crypto')) {
                            cryptoSelect = select;
                            for (let option of select.options) {
                                if (option.value === 'LTC' || option.text.includes('LTC')) {
                                    select.value = option.value;
                                    select.dispatchEvent(new Event('change'));
                                    console.log('Selected LTC in select:', select.id || select.name);
                                    return;
                                }
                            }
                        }
                    });

                    // Проверяем inputs, если select не нашёлся
                    if (!cryptoSelect) {
                        inputs.forEach(input => {
                            if (input.name.includes('to') || input.name.includes('crypto')) {
                                input.value = 'LTC';
                                input.dispatchEvent(new Event('input'));
                                console.log('Set LTC in input:', input.name);
                            }
                        });
                    }

                    if (!fiatSelect) {
                        inputs.forEach(input => {
                            if (input.name.includes('fiat')) {
                                input.value = 'EUR';
                                input.dispatchEvent(new Event('input'));
                                console.log('Set EUR in input:', input.name);
                            }
                        });
                    }

                    // Логируем элементы для отладки
                    console.log('Found selects:', selects);
                    console.log('Found inputs:', inputs);

                    // Повторяем, если не нашли
                    if (!fiatSelect || !cryptoSelect) {
                        console.log('Retrying in 1 second...');
                        setTimeout(selectCurrency, 1000);
                    } else {
                        tg.showPopup({
                            title: "Selection",
                            message: "EUR/LTC should be selected. Check console for details.",
                            buttons: [{ text: "OK", type: "default" }]
                        });
                    }
                }

                // Запускаем с задержкой
                setTimeout(selectCurrency, 3000);
            } catch (e) {
                console.error('Error accessing iframe:', e);
                tg.showPopup({
                    title: "Error",
                    message: "Cannot access Mercuryo page. Check console.",
                    buttons: [{ text: "OK", type: "default" }]
                });
            }
        };
    </script>
</body>
</html>
