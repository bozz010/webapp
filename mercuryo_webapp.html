<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercuryo Payment</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Redirecting to Mercuryo...</div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на полный экран

        // Получаем адрес из параметров URL
        const urlParams = new URLSearchParams(window.location.search);
        const address = urlParams.get('address') || '';

        // Загружаем Mercuryo в iframe, чтобы управлять страницей
        const iframe = document.createElement('iframe');
        iframe.src = `https://exchange.mercuryo.io/?fiat_currency=EUR&address=${encodeURIComponent(address)}`;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        document.body.appendChild(iframe);

        // Ждём, пока iframe загрузится
        iframe.onload = () => {
            // Получаем доступ к DOM внутри iframe
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

            // Функция для выбора валюты
            function selectCurrency() {
                // Ищем элементы для выбора фиатной валюты (EUR)
                let fiatSelect = iframeDoc.querySelector('select[name*="fiat"]') ||
                                 iframeDoc.querySelector('select[id*="fiat"]') ||
                                 iframeDoc.querySelector('input[name*="fiat"]') ||
                                 iframeDoc.querySelector('div[class*="fiat"] select');

                if (fiatSelect) {
                    if (fiatSelect.tagName === 'SELECT') {
                        for (let option of fiatSelect.options) {
                            if (option.value === 'EUR' || option.text.includes('EUR')) {
                                fiatSelect.value = option.value;
                                fiatSelect.dispatchEvent(new Event('change'));
                                console.log('Selected fiat currency: EUR');
                                break;
                            }
                        }
                    } else if (fiatSelect.tagName === 'INPUT') {
                        fiatSelect.value = 'EUR';
                        fiatSelect.dispatchEvent(new Event('input'));
                        console.log('Set fiat currency: EUR');
                    }
                } else {
                    console.error('Fiat selector not found');
                }

                // Ищем элементы для выбора криптовалюты (LTC)
                let cryptoSelect = iframeDoc.querySelector('select[name*="crypto"]') ||
                                  iframeDoc.querySelector('select[id*="crypto"]') ||
                                  iframeDoc.querySelector('input[name*="to"]') ||
                                  iframeDoc.querySelector('div[class*="crypto"] select');

                if (cryptoSelect) {
                    if (cryptoSelect.tagName === 'SELECT') {
                        for (let option of cryptoSelect.options) {
                            if (option.value === 'LTC' || option.text.includes('LTC')) {
                                cryptoSelect.value = option.value;
                                cryptoSelect.dispatchEvent(new Event('change'));
                                console.log('Selected crypto: LTC');
                                break;
                            }
                        }
                    } else if (cryptoSelect.tagName === 'INPUT') {
                        cryptoSelect.value = 'LTC';
                        cryptoSelect.dispatchEvent(new Event('input'));
                        console.log('Set crypto: LTC');
                    }
                } else {
                    console.error('Crypto selector not found');
                }

                // Проверяем, выбраны ли обе валюты
                if (!fiatSelect || !cryptoSelect) {
                    setTimeout(selectCurrency, 1000); // Повторяем через 1 секунду
                } else {
                    tg.showPopup({
                        title: "Currency Selection",
                        message: "EUR/LTC should be selected. Check if it worked.",
                        buttons: [{ text: "OK", type: "default" }]
                    });
                }
            }

            // Запускаем выбор валюты
            setTimeout(selectCurrency, 3000); // Ждём 3 секунды для полной загрузки
        };

        // Если iframe не загрузится
        setTimeout(() => {
            if (!iframe.contentDocument) {
                tg.showPopup({
                    title: "Loading Issue",
                    message: "Failed to load Mercuryo. Please retry.",
                    buttons: [{ text: "OK", type: "default" }]
                });
            }
        }, 5000);
    </script>
</body>
</html>
