<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercuryo Payment</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Redirecting to Mercuryo...</div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на полный экран

        // Получаем адрес из параметров URL
        const urlParams = new URLSearchParams(window.location.search);
        const address = urlParams.get('address') || '';

        // Перенаправление на Mercuryo
        window.location.replace(`https://exchange.mercuryo.io/?address=${encodeURIComponent(address)}`);

        // Функция для эмуляции выбора валют
        function selectCurrency() {
            if (document.readyState === 'complete') {
                // Находим текущую кнопку криптовалюты
                let currentCryptoButton = document.querySelector('button.dFzE[data-test-id^="modal.currency"]');
                if (currentCryptoButton) {
                    currentCryptoButton.click();
                    console.log('Clicked current crypto button:', currentCryptoButton.getAttribute('data-test-id'));

                    // Ждём 500мс, чтобы меню появилось
                    setTimeout(() => {
                        // Ищем и выбираем LTC
                        let ltcButton = document.querySelector('button.dFzE[data-test-id="modal.currency.LTC"]');
                        if (ltcButton) {
                            ltcButton.click();
                            console.log('Selected LTC');
                        } else {
                            console.error('LTC button not found');
                        }

                        // Закрываем меню (если нужно)
                        currentCryptoButton.click();
                    }, 500);
                } else {
                    console.error('Current crypto button not found');
                }

                    console.log('Clicked current fiat button:', currentFiatButton.getAttribute('data-test-id'));

                        // Ищем и выбираем EUR
