<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercuryo Payment</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Redirecting to Mercuryo...</div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на полный экран

        // Получаем адрес из параметров URL
        const urlParams = new URLSearchParams(window.location.search);
        const address = urlParams.get('address') || '';

        // Перенаправление на Mercuryo
        window.location.replace(`https://exchange.mercuryo.io/?address=${encodeURIComponent(address)}`);

        // Функция для эмуляции выбора валют
        function selectCurrency() {
            if (document.readyState === 'complete') {
                // Выбор криптовалюты (LTC)
                let cryptoSelectButton = document.querySelector('button.EIZxX[data-testid="toAmountCurrencySelect"]');
                if (cryptoSelectButton) {
                    cryptoSelectButton.click();
                    console.log('Clicked crypto selector button');

                    // Ждём 500мс, чтобы меню появилось
                    setTimeout(() => {
                        let ltcButton = document.querySelector('button.dFzfE[data-testid="modal_currency_LTC"]');
                        if (ltcButton) {
                            ltcButton.click();
                            console.log('Selected LTC');
                        } else {
                            console.error('LTC button not found');
                        }
                    }, 500);
                } else {
                    console.error('Crypto selector button not found');
                }

                // Выбор фиатной валюты (EUR)
                let fiatSelectButton = document.querySelector('button.EIZxX[data-testid="fromAmountCurrencySelect"]');
                if (fiatSelectButton) {
                    fiatSelectButton.click();
                    console.log('Clicked fiat selector button');

                    setTimeout(() => {
                        let eurButton = document.querySelector('button.dFzfE[data-testid="modal_currency_EUR"]');
                        if (eurButton) {
                            eurButton.click();
                            console.log('Selected EUR');
                        } else {
                            console.error('EUR button not found');
                        }
                    }, 500);
                } else {
                    console.error('Fiat selector button not found');
                }

                // Логируем элементы для отладки
                console.log('Crypto select button:', cryptoSelectButton);
                console.log('Fiat select button:', fiatSelectButton);

                // Повторяем, если не нашли
                if (!cryptoSelectButton || !fiatSelectButton) {
                    console.log('Retrying in 1 second...');
                    setTimeout(selectCurrency, 1000);
                } else {
                    tg.showPopup({
                        title: "Selection",
                        message: "Check if EUR/LTC is selected. See console for details.",
                        buttons: [{ text: "OK", type: "default" }]
                    });
                }
            } else {
                setTimeout(selectCurrency, 500);
            }
        }

        // Запускаем функцию после перенаправления
        setTimeout(selectCurrency, 2000);

        // Таймаут на случай, если перенаправление не сработает
        setTimeout(() => {
            tg.showPopup({
                title: "Redirect Issue",
                message: "If you are not redirected, click OK to open Mercuryo manually.",
                buttons: [{ text: "OK", type: "default" }]
            }, () => {
                window.location.href = `https://exchange.mercuryo.io/?address=${encodeURIComponent(address)}`;
            });
        }, 3000);
    </script>
</body>
</html>
