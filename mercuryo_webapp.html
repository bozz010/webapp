<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercuryo Payment</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Redirecting to Mercuryo...</div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на полный экран

        // Перенаправление на Mercuryo
        window.location.replace("https://exchange.mercuryo.io/");

        // Таймаут на случай, если перенаправление не сработает сразу
        setTimeout(() => {
            tg.showPopup({
                title: "Redirect Issue",
                message: "If you are not redirected, please click OK to open Mercuryo manually.",
                buttons: [{ text: "OK", type: "default" }]
            }, () => {
                window.location.href = "https://exchange.mercuryo.io/";
            });
        }, 2000);
    </script>
</body>
</html>
